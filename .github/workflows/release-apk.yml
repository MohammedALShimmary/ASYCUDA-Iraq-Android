name: Build & Publish Signed Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to build and publish (e.g. v4.1.0)'
        required: true
        default: 'v4.1.0'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    name: Build, Sign & Publish Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run 7-Suite Adversarial Security Verification
        run: |
          mkdir -p /tmp/sec-tests
          javac -d /tmp/sec-tests java-bridge/AsycudaBoot.java lorie/src/main/java/com/termux/x11/AsycudaSecurityValidator.java scripts/SecurityVerificationTest.java
          java -cp /tmp/sec-tests SecurityVerificationTest

      - name: Prepare Runtime & Recompile Open-Source Java Bridge JARs
        run: |
          mkdir -p lorie-app/src/main/assets /tmp/asycuda-repack
          curl -fSL "https://github.com/MohammedALShimmary/ASYCUDA-Iraq-Android/releases/download/v4.0.0/runtime-arm64.tar.xz" \
            -o lorie-app/src/main/assets/runtime-arm64.tar.xz
          echo "f3dc78325792ea764e82d108b54dfc6fe4d6d9fd752bafc83bb780403286b9c1  lorie-app/src/main/assets/runtime-arm64.tar.xz" | sha256sum -c -

          curl -fSL "https://github.com/MohammedALShimmary/ASYCUDA-Iraq-Android/releases/download/v4.0.5/asycuda-iraq.tar.xz" \
            -o /tmp/base-asycuda-iraq.tar.xz
          echo "d7f724041d358c824af58c790c83ddf525f623450dd303995bcfbf48d8d81d52  /tmp/base-asycuda-iraq.tar.xz" | sha256sum -c -
          tar -xJf /tmp/base-asycuda-iraq.tar.xz -C /tmp/asycuda-repack
          find /tmp/asycuda-repack/jars -type f ! -name '00_*.jar' -delete
          find /tmp/asycuda-repack -name '*.bak' -delete
          echo -n "jars/00_boot.jar:jars/00_jnlp.jar" > /tmp/asycuda-repack/classpath.txt

          bash java-bridge/build-bridge.sh
          cp java-bridge/build/00_boot.jar /tmp/asycuda-repack/jars/00_boot.jar
          cp java-bridge/build/00_bootpatch.jar /tmp/asycuda-repack/jars/00_bootpatch.jar
          cp java-bridge/build/00_bootpatch.jar /tmp/asycuda-repack/00_bootpatch.jar
          cp java-bridge/build/00_jnlp.jar /tmp/asycuda-repack/jars/00_jnlp.jar
          tar --owner=0 --group=0 --numeric-owner -cJf lorie-app/src/main/assets/asycuda-iraq.tar.xz -C /tmp/asycuda-repack .

      - name: Decode Release Keystore & Build Signed Release APK
        env:
          ASYCUDA_KEYSTORE_B64: ${{ secrets.ASYCUDA_KEYSTORE_B64 }}
          ASYCUDA_KEYSTORE_PASS: ${{ secrets.ASYCUDA_KEYSTORE_PASS }}
          ASYCUDA_KEY_PASS: ${{ secrets.ASYCUDA_KEY_PASS }}
        run: |
          echo "$ASYCUDA_KEYSTORE_B64" | base64 -d > lorie-app/asycuda_release.jks
          sed -i '/org.gradle.java.home/d' gradle.properties
          chmod +x gradlew
          ./gradlew :lorie-app:assembleRelease --no-daemon
          rm -f lorie-app/asycuda_release.jks
          git checkout -- gradle.properties

      - name: Verify APK Signature & Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          if [[ "$TAG" != v* ]]; then
            TAG="v4.1.0"
          fi
          APK_NAME="ASYCUDA_Iraq_${TAG}.apk"
          cp lorie-app/build/outputs/apk/release/lorie-app-release.apk "/tmp/${APK_NAME}"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "/tmp/${APK_NAME}"

          APK_SHA256=$(sha256sum "/tmp/${APK_NAME}" | awk '{print $1}')
          TAR_SHA256=$(sha256sum lorie-app/src/main/assets/asycuda-iraq.tar.xz | awk '{print $1}')
          RUN_SHA256=$(sha256sum lorie-app/src/main/assets/runtime-arm64.tar.xz | awk '{print $1}')
          echo "APK_SHA256=${APK_SHA256}"
          echo "TAR_SHA256=${TAR_SHA256}"
          echo "RUN_SHA256=${RUN_SHA256}"

          export TAG APK_SHA256 TAR_SHA256 RUN_SHA256
          # Sync exact CI-built SHA-256 digests into README.md and SECURITY.md on main
          python3 - << 'PYEOF'
          import os, re
          tag = os.environ["TAG"]
          apk_sha = os.environ["APK_SHA256"]
          tar_sha = os.environ["TAR_SHA256"]
          for path in ["README.md", "SECURITY.md"]:
              with open(path, "r") as f:
                  txt = f.read()
              txt = re.sub(
                  r'(\[\*\*`ASYCUDA_Iraq_' + re.escape(tag) + r'\.apk`\*\*\]\([^\)]+\)\s*\|\s*(?:[^\|]+\|\s*)?`)([0-9a-f]{64}|TBD_ON_RELEASE_BUILD)(`)',
                  lambda m: m.group(1) + apk_sha + m.group(3),
                  txt
              )
              txt = re.sub(
                  r'(\[\*\*`asycuda-iraq\.tar\.xz`\*\*\]\([^\)]+\)\s*\|\s*(?:[^\|]+\|\s*)?`)([0-9a-f]{64})(`)',
                  lambda m: m.group(1) + tar_sha + m.group(3),
                  txt
              )
              with open(path, "w") as f:
                  f.write(txt)
          PYEOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md SECURITY.md; then
            git add README.md SECURITY.md
            git commit -m "Docs: Sync CI-built SHA-256 checksums for ${TAG} [skip ci]"
            git push origin HEAD:main
          fi

          # Publish or update the GitHub Release and upload all 4 assets
          cat << EOF > /tmp/release_notes.md
          ## ASYCUDA World — Republic of Iraq (\`${TAG}\` • \`versionCode 43\`)

          ### What's New in \`${TAG}\`
          1. **Dynamic Network, Port & IP Architecture (Zero Hardcoded IPs/Ports)**:
             - Dynamically discovers JNLP launch arguments, RMI transport ports (\`so.rmi.url.port\`), and virtualized RMI endpoints directly from \`AWIQWorld.jnlp\`, \`ClientTransportLayer\`, and live system DNS resolution without hardcoded server IPs or fallback ports.
          2. **Seamless Wi-Fi & 4G Cellular Handover**:
             - Binds DNS resolution and HTTPS connections directly to Android's active network interface (\`ConnectivityManager.getActiveNetwork()\`) and automatically refreshes the runtime hosts cache upon network switches.
          3. **One-Way Clipboard Paste (Android to ASYCUDA Only) with Zero Logging**:
             - Enables seamless text pasting from Android into ASYCUDA via both Java Paste and keyboard clipboard paste, while strictly blocking clipboard export from ASYCUDA back to Android and ensuring zero clipboard or keystroke logging.
          4. **Faster Post-Login & Session Relog Performance**:
             - Enables full \`singleClientInit\` preloading (\`preload.DL=on\`, \`preload.desktop=on\`, \`preload.formatDictionary=on\`, \`preload.availableRT=on\`) and tuned RMI response timeouts so desktop restoration after login or idle logoff completes rapidly.
          5. **Runtime Stability & X11 Display Synchronization**:
             - Synchronizes X11 UNIX socket (\`:0\`) initialization prior to JVM launch and guards multi-linguistic translation lookups against null entries.
          6. **Security & Privacy Hardening**:
             - Enforces fail-closed \`SecurityManager\` sandbox initialization with canonical path protection, read-only JAR immutability, explicit JRE native library allowlisting, full-stack reflection checks, startup cryptographic JAR verification, constant-time \`MessageDigest.isEqual()\` IPC token verification with UID peer checks, and 100% in-RAM diagnostic log preview with automatic buffer zero-fill on close.

          ---

          ### SHA-256 Checksums (\`sha256sum\`)

          | Release Asset | SHA-256 Digest |
          | :--- | :--- |
          | **\`${APK_NAME}\`** | \`${APK_SHA256}\` |
          | **\`asycuda-iraq.tar.xz\`** | \`${TAR_SHA256}\` |
          | **\`runtime-arm64.tar.xz\`** | \`${RUN_SHA256}\` |

          ### APK X.509 Signing Certificate (\`apksigner verify --print-certs\`)
          - **Signer DN**: \`CN=Mohammed Ammar Hussein, OU=Logistics and Customs Software, O=ASYCUDA Iraq Open Source, L=Baghdad, ST=Baghdad, C=IQ\`
          - **SHA-256 Digest**: \`d302d4d050fb986e4088dd3e684c90662d00da748dde8da3d4966baea02da023\`
          EOF
          sed -i 's/^          //' /tmp/release_notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "ASYCUDA World — Republic of Iraq ${TAG}" --notes-file /tmp/release_notes.md
            gh release upload "$TAG" \
              "/tmp/${APK_NAME}" \
              lorie-app/src/main/assets/asycuda-iraq.tar.xz \
              lorie-app/src/main/assets/runtime-arm64.tar.xz \
              sbom.cdx.json \
              --clobber
          else
            gh release create "$TAG" \
              "/tmp/${APK_NAME}" \
              lorie-app/src/main/assets/asycuda-iraq.tar.xz \
              lorie-app/src/main/assets/runtime-arm64.tar.xz \
              sbom.cdx.json \
              --title "ASYCUDA World — Republic of Iraq ${TAG}" \
              --notes-file /tmp/release_notes.md \
              --latest
          fi

          # Automatically flag all older releases as Superseded — Not Recommended
          python3 - << 'PYEOF'
          import os, json, urllib.request
          current_tag = os.environ["TAG"]
          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ.get("GITHUB_REPOSITORY", "MohammedALShimmary/ASYCUDA-Iraq-Android")
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json"
          }
          banner = (
              "> [!CAUTION]\n"
              f"> **⚠️ SUPERSEDED RELEASE — NOT RECOMMENDED FOR PRODUCTION USE**\n"
              f"> This release has been superseded by **{current_tag}**. Please download and install **{current_tag}** from the [Latest Release page](https://github.com/{repo}/releases/latest) or update via the In-App Update Center.\n\n---\n\n"
          )
          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases", headers=headers)
          rels = json.loads(urllib.request.urlopen(req).read().decode())
          for r in rels:
              t = r["tag_name"]
              if t == current_tag:
                  continue
              body = r.get("body") or ""
              if "SUPERSEDED RELEASE — NOT RECOMMENDED" not in body:
                  body = banner + body
              payload = json.dumps({
                  "name": f"{t} — [SUPERSEDED — NOT RECOMMENDED (Security & Architecture Upgrade Available)]",
                  "body": body,
                  "prerelease": True
              }).encode("utf-8")
              preq = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases/{r['id']}",
                  data=payload, headers=headers, method="PATCH"
              )
              urllib.request.urlopen(preq).read()
          PYEOF

      - name: Generate Cryptographic SLSA Build Provenance Attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            lorie-app/build/outputs/apk/release/lorie-app-release.apk
            lorie-app/src/main/assets/asycuda-iraq.tar.xz
