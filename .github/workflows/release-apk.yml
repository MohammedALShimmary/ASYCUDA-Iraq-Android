name: Build & Publish Signed Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to build and publish (e.g. v4.4.1)'
        required: true
        default: 'v4.4.1'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    name: Build, Sign & Publish Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run 7-Suite Adversarial Security Verification
        run: |
          mkdir -p /tmp/sec-tests
          javac -encoding UTF-8 -d /tmp/sec-tests lorie/src/main/java/com/termux/x11/AsycudaSecurityValidator.java scripts/SecurityVerificationTest.java
          java -cp /tmp/sec-tests SecurityVerificationTest

      - name: Prepare Runtime & Inject Proprietary R8-Obfuscated Java Bridge JARs
        env:
          BRIDGE_REPO_TOKEN: ${{ secrets.BRIDGE_REPO_TOKEN }}
        run: |
          mkdir -p lorie-app/src/main/assets /tmp/asycuda-repack/jars /tmp/asycuda-repack/icons
          GH_TOKEN="$BRIDGE_REPO_TOKEN" gh release download v1.0.0-runtime -R MohammedALShimmary/ASYCUDA-Java-Bridge-Private -p "runtime-arm64.tar.xz" -O lorie-app/src/main/assets/runtime-arm64.tar.xz
          echo "04cdd11f4fb4ceef01ca482d78ad8e8248b3a284edb1c9133518b68fe5af1e37  lorie-app/src/main/assets/runtime-arm64.tar.xz" | sha256sum -c -

          curl -fSL -H "Authorization: Bearer ${BRIDGE_REPO_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/MohammedALShimmary/ASYCUDA-Java-Bridge-Private/contents/build/bridge-jars-bundle.tar.xz" \
            -o /tmp/bridge-jars-bundle.tar.xz
          tar -xJf /tmp/bridge-jars-bundle.tar.xz -C /tmp/asycuda-repack
          rm -f /tmp/bridge-jars-bundle.tar.xz

          echo -n "jars/00_boot.jar:jars/00_jnlp.jar" > /tmp/asycuda-repack/classpath.txt
          cp config/AWIQWorld.jnlp /tmp/asycuda-repack/AWIQWorld.jnlp
          cp config/known-errors-catalog.json /tmp/asycuda-repack/known-errors-catalog.json
          cp config/mof.crt /tmp/asycuda-repack/mof.crt
          cp config/folder.png /tmp/asycuda-repack/icons/folder.png
          cp lorie/src/main/res/drawable/ic_asycuda_logo.png /tmp/asycuda-repack/icons/asycuda.png

          python3 - << 'PYEOF'
          import os, tarfile, io, subprocess
          OLD = b"/data/data/" + b"iq" + b".asycuda/files"
          NEW = b"/proc/self/cwd/.asy_runtime"
          runtime_tar = "lorie-app/src/main/assets/runtime-arm64.tar.xz"
          tmp_in = "/tmp/runtime_in.tar"
          tmp_out = "/tmp/runtime_out.tar"
          subprocess.run(["xz", "-d", "-k", "-c", runtime_tar], stdout=open(tmp_in, "wb"), check=True)
          patched_files = {}
          with tarfile.open(tmp_in, "r:") as tf_in, tarfile.open(tmp_out, "w:") as tf_out:
              for m in tf_in.getmembers():
                  if m.isfile():
                      raw = tf_in.extractfile(m).read()
                      if OLD in raw:
                          raw = raw.replace(OLD, NEW)
                      if m.name in ("jre8/jre/lib/aarch64/jli/libjli.so", "jre8/lib/aarch64/jli/libjli.so"):
                          patched = raw.replace(b"/proc/self/exe", b"/proc/self/exX")
                          key = "jre_libjli.so" if "jre/lib" in m.name else "jdk_libjli.so"
                          patched_files[key] = patched
                      m.size = len(raw)
                      tf_out.addfile(m, io.BytesIO(raw))
                  else:
                      tf_out.addfile(m)
          subprocess.run(["xz", "-T0", "-6", "-c", tmp_out], stdout=open(runtime_tar, "wb"), check=True)
          os.remove(tmp_in)
          os.remove(tmp_out)

          with tarfile.open("lorie-app/src/main/assets/asycuda-iraq.tar.xz", "w:xz", preset=6) as tf:
              for k, data in patched_files.items():
                  ti = tarfile.TarInfo(name=k)
                  ti.size = len(data)
                  ti.mode = 0o700
                  tf.addfile(ti, io.BytesIO(data))
              tf.add("/tmp/asycuda-repack", arcname=".")
          PYEOF

      - name: Decode Release Keystore & Build Signed Release APK & Google Play AAB
        env:
          ASYCUDA_KEYSTORE_B64: ${{ secrets.ASYCUDA_KEYSTORE_B64 }}
          ASYCUDA_KEYSTORE_PASS: ${{ secrets.ASYCUDA_KEYSTORE_PASS }}
          ASYCUDA_KEY_PASS: ${{ secrets.ASYCUDA_KEY_PASS }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          echo "$ASYCUDA_KEYSTORE_B64" | base64 -d > lorie-app/asycuda_release.jks
          sed -i '/org.gradle.java.home/d' gradle.properties
          chmod +x gradlew
          ./gradlew :lorie-app:assembleRelease :lorie-app:bundleRelease -x lintVitalRelease -x lintVitalAnalyzeRelease --no-daemon
          rm -f lorie-app/asycuda_release.jks
          git checkout -- gradle.properties

      - name: Verify APK Signature & Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          if [[ "$TAG" != v* ]]; then
            TAG="v4.4.1"
          fi
          APK_NAME="AsyLauncher_${TAG}.apk"
          AAB_NAME="AsyLauncher_${TAG}.aab"
          cp lorie-app/build/outputs/apk/release/lorie-app-release.apk "/tmp/${APK_NAME}"
          cp lorie-app/build/outputs/bundle/release/lorie-app-release.aab "/tmp/${AAB_NAME}"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "/tmp/${APK_NAME}"

          APK_SHA256=$(sha256sum "/tmp/${APK_NAME}" | awk '{print $1}')
          AAB_SHA256=$(sha256sum "/tmp/${AAB_NAME}" | awk '{print $1}')
          TAR_SHA256=$(sha256sum lorie-app/src/main/assets/asycuda-iraq.tar.xz | awk '{print $1}')
          RUN_SHA256=$(sha256sum lorie-app/src/main/assets/runtime-arm64.tar.xz | awk '{print $1}')
          echo "APK_SHA256=${APK_SHA256}"
          echo "AAB_SHA256=${AAB_SHA256}"
          echo "TAR_SHA256=${TAR_SHA256}"
          echo "RUN_SHA256=${RUN_SHA256}"

          export TAG APK_SHA256 AAB_SHA256 TAR_SHA256 RUN_SHA256
          # Sync exact CI-built SHA-256 digests into README.md and SECURITY.md on main
          python3 - << 'PYEOF'
          import os, re
          tag = os.environ["TAG"]
          apk_sha = os.environ["APK_SHA256"]
          aab_sha = os.environ["AAB_SHA256"]
          tar_sha = os.environ["TAR_SHA256"]
          for path in ["README.md", "SECURITY.md"]:
              with open(path, "r") as f:
                  txt = f.read()
              txt = re.sub(
                  r'(\[\*\*`AsyLauncher_' + re.escape(tag) + r'\.apk`\*\*\]\([^\)]+\)\s*\|\s*(?:[^\|]+\|\s*)?`)([0-9a-f]{64}|TBD_ON_RELEASE_BUILD)(`)',
                  lambda m: m.group(1) + apk_sha + m.group(3),
                  txt
              )
              txt = re.sub(
                  r'(\[\*\*`AsyLauncher_' + re.escape(tag) + r'\.aab`\*\*\]\([^\)]+\)\s*\|\s*(?:[^\|]+\|\s*)?`)([0-9a-f]{64}|TBD_ON_RELEASE_BUILD)(`)',
                  lambda m: m.group(1) + aab_sha + m.group(3),
                  txt
              )
              txt = re.sub(
                  r'(\[\*\*`asycuda-iraq\.tar\.xz`\*\*\]\([^\)]+\)\s*\|\s*(?:[^\|]+\|\s*)?`)([0-9a-f]{64})(`)',
                  lambda m: m.group(1) + tar_sha + m.group(3),
                  txt
              )
              with open(path, "w") as f:
                  f.write(txt)
          PYEOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md SECURITY.md; then
            git add README.md SECURITY.md
            git commit -m "Docs: Sync CI-built SHA-256 checksums for ${TAG} [skip ci]"
            git push origin HEAD:main
            git tag -f "${TAG}"
            git push origin -f "refs/tags/${TAG}"
          fi

          # Publish or update the GitHub Release and upload public assets
          cat << EOF > /tmp/release_notes.md
          # AsyLauncher — Launcher for ASYCUDA (\`${TAG}\` • \`versionCode 58\`)

          **AsyLauncher** (\`io.github.mohammedalshimmary.asylauncher\`) is an independent, unofficial Android compatibility launcher for running the ASYCUDA World desktop client on phones and tablets.

          ### What's New in \`${TAG}\` (\`versionCode 58\`)
          1. **Proprietary Java Bridge Hardening (Host APK Certificate Binding, String Encryption & Full R8)**:
             - Added runtime host APK X.509 certificate verification (\`verifyHostApkIntegrity()\`) and build-time string literal encryption across \`00_boot.jar\`, \`00_bootpatch.jar\`, and \`00_jnlp.jar\`, plus full R8 obfuscation on \`00_bootpatch.jar\` and \`00_jnlp.jar\`.
          2. **Window Corner & Edge Resize Enhancement**:
             - Upgraded corner and edge touch hit-testing, Z-order painter's algorithm occlusion, and EventQueue dispatch interception for effortless 1-finger resizing of internal windows across all UI scale presets.
          3. **Pre-Disk JVM Log Redaction Pipe & Auto-Cleanup**:
             - Replaced direct JVM output file redirection with an in-RAM log pump (\`AsycudaSecurityValidator.redactSensitiveLogContent()\`) that scrubs credentials before disk persistence and clears runtime \`.log\` files on graceful exit.
          4. **Google Play Compliance & Accessible Official Information Sources**:
             - Updated official government and UNCTAD information links in Terms & Conditions, About, and \`PRIVACY_POLICY.md\` to globally accessible URLs (\`www.mof.gov.iq\`, \`asycuda.org\`, \`asycuda.org/en/user-countries/\`) while clearly explaining Iraq geo-restriction of the customs endpoint.
          5. **Firestore Security Rules (\`firestore.rules\`) & Usage Heartbeat Opt-Out**:
             - Published \`firestore.rules\` in the repository, added \`X-Android-Cert\` binding on Firestore REST requests without client-side \`SHA-1\` digest calls, and added a persistent ON/OFF toggle for the 6-field anonymous daily heartbeat inside **About, Security & Software Licences**.

          ---

          ## 🇮🇶 الجديد في الإصدار \`${TAG}\` (\`versionCode 58\`) — (العربية)

          1. **تعزيز حماية محرك الجافا الاحتكاري (\`00_boot.jar\`, \`00_bootpatch.jar\`, \`00_jnlp.jar\`)**: التحقق التلقائي من التوقيع الرقمي لتطبيق الأندرويد المضيف (\`X.509\`)، وتشفير النصوص البرمجية أثناء البناء، وتطبيق تشويش **R8** الكامل على كافة ملفات الجسر الثلاثة.
          2. **تحسين استجابة لمس حواف وزوايا النوافذ الداخلية**: ترقية كشف الزوايا والحواف لتكبير وتصغير النوافذ بسهولة بإصبع واحد في جميع أوضاع العرض.
          3. **تنقية سجلات الجافا في الذاكرة قبل الحفظ**: تمرير مخرجات الجافا عبر فلتر التنقية (\`AsycudaSecurityValidator\`) لإزالة أي بيانات حساسة قبل الكتابة على القرص وحذف السجلات المؤقتة عند الإغلاق الآمن.
          4. **تحديث روابط المصادر الرسمية وتوافق متجر Google Play**: اعتماد الروابط الحكومية والأممية المتاحة عالمياً (\`www.mof.gov.iq\` و \`asycuda.org\`) في الشروط وحول التطبيق وسياسة الخصوصية.
          5. **إعدادات خصوصية نبضة الاستخدام (\`Heartbeat Opt-Out\`) ونشر قواعد أمان Firestore**: إضافة مفتاح تفعيل/إيقاف فوري لنبضة الاستخدام المجهولة داخل نافذة «حول التطبيق»، ونشر \`firestore.rules\` في المستودع مع إرفاق ترويسة \`X-Android-Cert\`.

          ---

          ## نوێکارییەکانی وەشانی \`${TAG}\` (\`versionCode 58\`) — (کوردی)

          1. **بەهێزکردنی پاراستنی بزوێنەری جاڤا**: پشکنینی واژۆی دیجیتاڵی بەرنامەی ئەندرۆید، شفرەکردنی دەقەکان، و تەشویشکردنی **R8** بۆ هەموو پەڕگەکانی پردی جاڤا.
          2. **باشترکردنی هەستیاری دەستلێدان بۆ گۆشە و قەراغەکانی پەنجەرە ناوخۆییەکان** بۆ گەورەکردن و بچووککردنەوەی پەنجەرەکان بە یەک پەنجە.
          3. **پاڵاوتنی تۆمارەکانی جاڤا لە بیرگەدا پێش پاشەکەوتکردن** و سڕینەوەی تۆمارە کاتییەکان لە کاتی داخستندا.
          4. **نوێکردنەوەی بەستەرە فەرمییە گشتییەکان (\`www.mof.gov.iq\`, \`asycuda.org\`)** و زیادکردنی **کلیلی ڕاگرتن/کارپێکردنی ناردنی ئاماری بەکارهێنان** لە بەشی «دەربارەی بەرنامە».

          ---

          ### SHA-256 Checksums (\`sha256sum\`)

          | Release Asset | SHA-256 Digest |
          | :--- | :--- |
          | **\`${APK_NAME}\`** | \`${APK_SHA256}\` |
          | **\`sbom.cdx.json\`** | Tracked in repository root |

          ### APK X.509 Signing Certificate (\`apksigner verify --print-certs\`)
          - **Signer DN**: \`CN=Mohammed Ammar Hussein, OU=Logistics and Customs Software, O=ASYCUDA Iraq Open Source, L=Baghdad, ST=Baghdad, C=IQ\`
          - **SHA-256 Digest**: \`d302d4d050fb986e4088dd3e684c90662d00da748dde8da3d4966baea02da023\`
          EOF
          sed -i 's/^          //' /tmp/release_notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft=false --prerelease=false --title "${TAG} — AsyLauncher (Bridge Hardening, Pre-Disk Log Redaction, Telemetry Opt-Out & Play Compliance)" --notes-file /tmp/release_notes.md --latest
            gh release upload "$TAG" \
              "/tmp/${APK_NAME}" \
              sbom.cdx.json \
              --clobber
            gh release delete-asset "$TAG" asycuda-iraq.tar.xz --yes || true
            gh release delete-asset "$TAG" runtime-arm64.tar.xz --yes || true
          else
            gh release create "$TAG" \
              "/tmp/${APK_NAME}" \
              sbom.cdx.json \
              --title "${TAG} — AsyLauncher (Bridge Hardening, Pre-Disk Log Redaction, Telemetry Opt-Out & Play Compliance)" \
              --notes-file /tmp/release_notes.md \
              --latest
          fi

      - name: Upload Signed Google Play AAB as Private Workflow Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AsyLauncher-play-aab
          path: |
            lorie-app/build/outputs/bundle/release/lorie-app-release.aab
            lorie-app/build/outputs/mapping/release/mapping.txt
          retention-days: 14

      - name: Generate Cryptographic SLSA Build Provenance Attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            lorie-app/build/outputs/apk/release/lorie-app-release.apk
            lorie-app/src/main/assets/asycuda-iraq.tar.xz
