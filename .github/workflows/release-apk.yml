name: Build & Publish Signed Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to build and publish (e.g. v4.4.0)'
        required: true
        default: 'v4.4.0'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    name: Build, Sign & Publish Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run 7-Suite Adversarial Security Verification
        run: |
          mkdir -p /tmp/sec-tests
          javac -encoding UTF-8 -d /tmp/sec-tests lorie/src/main/java/com/termux/x11/AsycudaSecurityValidator.java scripts/SecurityVerificationTest.java
          java -cp /tmp/sec-tests SecurityVerificationTest

      - name: Prepare Runtime & Inject Proprietary R8-Obfuscated Java Bridge JARs
        env:
          BRIDGE_REPO_TOKEN: ${{ secrets.BRIDGE_REPO_TOKEN }}
        run: |
          mkdir -p lorie-app/src/main/assets /tmp/asycuda-repack/jars /tmp/asycuda-repack/icons
          GH_TOKEN="$BRIDGE_REPO_TOKEN" gh release download v1.0.0-runtime -R MohammedALShimmary/ASYCUDA-Java-Bridge-Private -p "runtime-arm64.tar.xz" -O lorie-app/src/main/assets/runtime-arm64.tar.xz
          echo "04cdd11f4fb4ceef01ca482d78ad8e8248b3a284edb1c9133518b68fe5af1e37  lorie-app/src/main/assets/runtime-arm64.tar.xz" | sha256sum -c -

          curl -fSL -H "Authorization: Bearer ${BRIDGE_REPO_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/MohammedALShimmary/ASYCUDA-Java-Bridge-Private/contents/build/bridge-jars-bundle.tar.xz" \
            -o /tmp/bridge-jars-bundle.tar.xz
          tar -xJf /tmp/bridge-jars-bundle.tar.xz -C /tmp/asycuda-repack
          rm -f /tmp/bridge-jars-bundle.tar.xz

          echo -n "jars/00_boot.jar:jars/00_jnlp.jar" > /tmp/asycuda-repack/classpath.txt
          cp config/AWIQWorld.jnlp /tmp/asycuda-repack/AWIQWorld.jnlp
          cp config/known-errors-catalog.json /tmp/asycuda-repack/known-errors-catalog.json
          cp config/mof.crt /tmp/asycuda-repack/mof.crt
          cp config/folder.png /tmp/asycuda-repack/icons/folder.png
          cp lorie/src/main/res/drawable/ic_asycuda_logo.png /tmp/asycuda-repack/icons/asycuda.png

          python3 - << 'PYEOF'
          import os, tarfile, io, subprocess
          OLD = b"/data/data/" + b"iq" + b".asycuda/files"
          NEW = b"/proc/self/cwd/.asy_runtime"
          runtime_tar = "lorie-app/src/main/assets/runtime-arm64.tar.xz"
          tmp_in = "/tmp/runtime_in.tar"
          tmp_out = "/tmp/runtime_out.tar"
          subprocess.run(["xz", "-d", "-k", "-c", runtime_tar], stdout=open(tmp_in, "wb"), check=True)
          patched_files = {}
          with tarfile.open(tmp_in, "r:") as tf_in, tarfile.open(tmp_out, "w:") as tf_out:
              for m in tf_in.getmembers():
                  if m.isfile():
                      raw = tf_in.extractfile(m).read()
                      if OLD in raw:
                          raw = raw.replace(OLD, NEW)
                      if m.name in ("jre8/jre/lib/aarch64/jli/libjli.so", "jre8/lib/aarch64/jli/libjli.so"):
                          patched = raw.replace(b"/proc/self/exe", b"/proc/self/exX")
                          key = "jre_libjli.so" if "jre/lib" in m.name else "jdk_libjli.so"
                          patched_files[key] = patched
                      m.size = len(raw)
                      tf_out.addfile(m, io.BytesIO(raw))
                  else:
                      tf_out.addfile(m)
          subprocess.run(["xz", "-T0", "-6", "-c", tmp_out], stdout=open(runtime_tar, "wb"), check=True)
          os.remove(tmp_in)
          os.remove(tmp_out)

          with tarfile.open("lorie-app/src/main/assets/asycuda-iraq.tar.xz", "w:xz", preset=6) as tf:
              for k, data in patched_files.items():
                  ti = tarfile.TarInfo(name=k)
                  ti.size = len(data)
                  ti.mode = 0o700
                  tf.addfile(ti, io.BytesIO(data))
              tf.add("/tmp/asycuda-repack", arcname=".")
          PYEOF

      - name: Decode Release Keystore & Build Signed Release APK & Google Play AAB
        env:
          ASYCUDA_KEYSTORE_B64: ${{ secrets.ASYCUDA_KEYSTORE_B64 }}
          ASYCUDA_KEYSTORE_PASS: ${{ secrets.ASYCUDA_KEYSTORE_PASS }}
          ASYCUDA_KEY_PASS: ${{ secrets.ASYCUDA_KEY_PASS }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          echo "$ASYCUDA_KEYSTORE_B64" | base64 -d > lorie-app/asycuda_release.jks
          sed -i '/org.gradle.java.home/d' gradle.properties
          chmod +x gradlew
          ./gradlew :lorie-app:assembleRelease :lorie-app:bundleRelease -x lintVitalRelease -x lintVitalAnalyzeRelease --no-daemon
          rm -f lorie-app/asycuda_release.jks
          git checkout -- gradle.properties

      - name: Verify APK Signature & Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          if [[ "$TAG" != v* ]]; then
            TAG="v4.4.0"
          fi
          APK_NAME="AsyLauncher_${TAG}.apk"
          AAB_NAME="AsyLauncher_${TAG}.aab"
          cp lorie-app/build/outputs/apk/release/lorie-app-release.apk "/tmp/${APK_NAME}"
          cp lorie-app/build/outputs/bundle/release/lorie-app-release.aab "/tmp/${AAB_NAME}"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "/tmp/${APK_NAME}"

          APK_SHA256=$(sha256sum "/tmp/${APK_NAME}" | awk '{print $1}')
          AAB_SHA256=$(sha256sum "/tmp/${AAB_NAME}" | awk '{print $1}')
          TAR_SHA256=$(sha256sum lorie-app/src/main/assets/asycuda-iraq.tar.xz | awk '{print $1}')
          RUN_SHA256=$(sha256sum lorie-app/src/main/assets/runtime-arm64.tar.xz | awk '{print $1}')
          echo "APK_SHA256=${APK_SHA256}"
          echo "AAB_SHA256=${AAB_SHA256}"
          echo "TAR_SHA256=${TAR_SHA256}"
          echo "RUN_SHA256=${RUN_SHA256}"

          export TAG APK_SHA256 AAB_SHA256 TAR_SHA256 RUN_SHA256
          # Sync exact CI-built SHA-256 digests into README.md and SECURITY.md on main
          python3 - << 'PYEOF'
          import os, re
          tag = os.environ["TAG"]
          apk_sha = os.environ["APK_SHA256"]
          aab_sha = os.environ["AAB_SHA256"]
          tar_sha = os.environ["TAR_SHA256"]
          for path in ["README.md", "SECURITY.md"]:
              with open(path, "r") as f:
                  txt = f.read()
              txt = re.sub(
                  r'(\[\*\*`AsyLauncher_' + re.escape(tag) + r'\.apk`\*\*\]\([^\)]+\)\s*\|\s*(?:[^\|]+\|\s*)?`)([0-9a-f]{64}|TBD_ON_RELEASE_BUILD)(`)',
                  lambda m: m.group(1) + apk_sha + m.group(3),
                  txt
              )
              txt = re.sub(
                  r'(\[\*\*`AsyLauncher_' + re.escape(tag) + r'\.aab`\*\*\]\([^\)]+\)\s*\|\s*(?:[^\|]+\|\s*)?`)([0-9a-f]{64}|TBD_ON_RELEASE_BUILD)(`)',
                  lambda m: m.group(1) + aab_sha + m.group(3),
                  txt
              )
              txt = re.sub(
                  r'(\[\*\*`asycuda-iraq\.tar\.xz`\*\*\]\([^\)]+\)\s*\|\s*(?:[^\|]+\|\s*)?`)([0-9a-f]{64})(`)',
                  lambda m: m.group(1) + tar_sha + m.group(3),
                  txt
              )
              with open(path, "w") as f:
                  f.write(txt)
          PYEOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md SECURITY.md; then
            git add README.md SECURITY.md
            git commit -m "Docs: Sync CI-built SHA-256 checksums for ${TAG} [skip ci]"
            git push origin HEAD:main
          fi

          # Publish or update the GitHub Release and upload public assets
          cat << EOF > /tmp/release_notes.md
          # AsyLauncher — Launcher for ASYCUDA (\`${TAG}\` • \`versionCode 56\`)

          **AsyLauncher** (\`io.github.mohammedalshimmary.asylauncher\`) is an independent, unofficial Android compatibility launcher for running the ASYCUDA World desktop client on phones and tablets.

          ### What's New in \`${TAG}\` (\`versionCode 56\`)
          1. **Previous Declaration (PD) Print Restoration & Final Declarations Table Print Fix**:
             - Restored the unresponsive **Print** button inside the End-of-Transaction confirmation dialog for Previous Declarations (\`البيان المسبق\`), generating and opening the official multi-page customs declaration PDF directly on Android.
             - Resolved the empty-header exception when printing **Final Declarations (\`تفاصيل البيان\`)** search tables.
          2. **Search Table Vector PDF Printer & Native Excel (\`.xlsx\`) Exporter (\`CWE-1236\` Protected)**:
             - Upgraded \`ASYCUDA_PDF_Printer\` (Portrait & Landscape) with crisp vector table headers, automatic column-width fitting, RTL Arabic text shaping, and full-row pagination.
             - Added \`ASYCUDA_Excel_Exporter\` directly inside ASYCUDA's print dialog so customs brokers can export any search result table into an OpenXML Excel (\`.xlsx\`) spreadsheet inside the Private App Vault.
          3. **Font & UI Scaling Engine + Live Display Stability Benchmark**:
             - Choose **Default (100%)**, **Comfort (Medium)**, or **Touch (Large)** in Display Settings to dynamically enlarge ASYCUDA World's internal Swing menus, document trees, tables, buttons, and cursors across all screen densities without restarting the session.
             - Added a real-time **Display Stability & Clarity Benchmark** indicator in Display Settings that evaluates active canvas resolution, DPI, UI preset, and live frame pacing.
          4. **Direct Touchscreen Window Resizing, Search Dropdown & File-Chooser Enhancements**:
             - **Touch-Friendly Window Resizing**: Expanded outer resize grab zones for internal Swing frames (\`JInternalFrame\`) with interactive control protection so inner buttons, scrollbars, and tabs remain clickable while window edges and corners resize smoothly by finger drag.
             - **Search Criteria Dropdown Stability & Auto-Keyboard Guard**: Prevented immediate dropdown collapse in **Declaration Search (\`بحث البيان\`)** and **Previous Declaration Search (\`بحث البيان المسبق\`)** across both Direct Touchscreen and Trackpad modes, and suppressed premature keyboard popups when selecting dropdown criteria in Column 2 (\`المعيار\`).
             - **Single-Tap \`JFileChooser\` Selection & Titlebar Shade/Restore**: Enabled single-tap file selection in Java file choosers, eliminated accidental tooltip hold traps on toolbar buttons (\`جديد\`), and restored double-tap titlebar un-minimize/restore for shaded windows.
          5. **High-FPS (120Hz) & GPU Acceleration + Multi-Card Cloud Broadcasts**:
             - Added high-refresh-rate (\`60Hz–120Hz\`) frame pacing and hardware GPU acceleration in Display Settings, plus a scrollable multi-card Cloud Broadcast feed displaying up to 10 cached News & Release announcements.
          6. **JVM Sandbox Hardening & Official Government Source Links**:
             - Locked the JVM \`SecurityManager\` against \`PropertyPermission\` write tampering and \`.asycuda_display_state\` IPC file modification from inside the JVM sandbox, and added clickable official Ministry of Finance & UNCTAD source links inside the in-app Terms & Conditions and About dialogs.

          ---

          ## 🇮🇶 الجديد في الإصدار \`${TAG}\` (\`versionCode 56\`) — (العربية)

          1. **إصلاح طباعة البيان المسبق (PD) وطباعة جدول تفاصيل البيان**: تفعيل زر الطباعة داخل نافذة إتمام العملية للبيان المسبق لتوليد وفتح ملف \`PDF\` الرسمي مباشرة، ومعالجة خطأ الأعمدة الفارغة عند طباعة جدول بحث تفاصيل البيان.
          2. **طباعة الجداول بدقة عالية وتصدير مباشر إلى ملف إكسل (\`Excel .xlsx\`)**: تطوير طابعة \`ASYCUDA_PDF_Printer\` (عمودي/أفقي) وإضافة \`ASYCUDA_Excel_Exporter\` داخل نافذة الطباعة لتصدير نتائج البحث مباشرة إلى جدول \`Excel (.xlsx)\` داخل الخزنة الخاصة مع حماية ضد حقن المعادلات.
          3. **محرك تكبير الخطوط والقوائم الذكي ومؤشر استقرار الشاشة الحي**: إمكانية اختيار حجم واجهة وخطوط أسيكودا (**افتراضي** / **مريح** / **كبير للمس**) مع تطبيق حي فوري دون إعادة تشغيل الجلسة، ومؤشر حي لتقييم سلاسة واستقرار العرض.
          4. **تحسينات شاملة لوضع اللمس المباشر والنوافذ**: تسهيل تكبير وتصغير النوافذ الداخلية من الحواف والزوايا باللمس دون التأثير على الأزرار الداخلية، تثبيت القوائم المنسدلة في **بحث البيان** و**بحث البيان المسبق** ومنع الظهور المبكر للوحة المفاتيح عند اختيار **المعيار**، تفعيل اختيار الملفات بلمسة واحدة في متصفح ملفات الجافا، واستعادة فتح النوافذ المطوية بنقرتين على شريط العنوان.
          5. **دعم معدل الإطارات العالي (\`120Hz\`) وتسريع الرسوميات وسجل التنبيهات المتعدد**: سلاسة فائقة في تحريك النوافذ والماوس مع عرض حتى ١٠ إشعارات وتنبيهات سحابية محفوظة.

          ---

          ## نوێکارییەکانی وەشانی \`${TAG}\` (\`versionCode 56\`) — (کوردی)

          1. **چاککردنی چاپکردنی بەیانی پێشوەختە (PD) و خشتەی گەڕان**: چالاککردنی دوگمەی چاپکردن لە پەنجەرەی کۆتایی مامەڵە و کردنەوەی پەڕگەی \`PDF\`، لەگەڵ چارەسەرکردنی کێشەی چاپکردنی خشتەی گەڕان.
          2. **چاپکردنی خشتەکان بە کوالێتی بەرز و هەناردەکردن بۆ Excel (\`.xlsx\`)**: زیادکردنی \`ASYCUDA_Excel_Exporter\` لە پەنجەرەی چاپکردن بۆ هەناردەکردنی ئەنجامەکانی گەڕان ڕاستەوخۆ بۆ پەڕگەی ئێکسڵ.
          3. **گەورەکردنی فۆنت و لیستەکانی ئەسیکۆدا و پێوەری جێگیریی شاشە**: هەڵبژاردنی قەبارەی فۆنت و ڕووکار (**بنەڕەتی** / **مامناوەند** / **گەورە بۆ لەمس**) بە جێبەجێکردنی دەستبەجێ.
          4. **باشترکردنی شاشەی لەمسی ڕاستەوخۆ**: ئاسانکردنی گۆڕینی قەبارەی پەنجەرەکان، جێگیرکردنی لیستەکانی گەڕان بەبێ دەرکەوتنی پێشوەختەی کیبۆرد، و هەڵبژاردنی پەڕگەکان بە یەک دەستلێدان.
          5. **خێراکردنی گرافیک (\`120Hz\`) و پیشاندانی تا ١٠ ئاگاداری هەوری پاشەکەوتکراو**.

          ---

          ### SHA-256 Checksums (\`sha256sum\`)

          | Release Asset | SHA-256 Digest |
          | :--- | :--- |
          | **\`${APK_NAME}\`** | \`${APK_SHA256}\` |
          | **\`sbom.cdx.json\`** | Tracked in repository root |

          ### APK X.509 Signing Certificate (\`apksigner verify --print-certs\`)
          - **Signer DN**: \`CN=Mohammed Ammar Hussein, OU=Logistics and Customs Software, O=ASYCUDA Iraq Open Source, L=Baghdad, ST=Baghdad, C=IQ\`
          - **SHA-256 Digest**: \`d302d4d050fb986e4088dd3e684c90662d00da748dde8da3d4966baea02da023\`
          EOF
          sed -i 's/^          //' /tmp/release_notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft=false --prerelease=false --title "${TAG} — AsyLauncher (PD Print Fix, Excel Exporter, Touch Resizing & Font Scaling, 120Hz)" --notes-file /tmp/release_notes.md --latest
            gh release upload "$TAG" \
              "/tmp/${APK_NAME}" \
              sbom.cdx.json \
              --clobber
            gh release delete-asset "$TAG" asycuda-iraq.tar.xz --yes || true
            gh release delete-asset "$TAG" runtime-arm64.tar.xz --yes || true
          else
            gh release create "$TAG" \
              "/tmp/${APK_NAME}" \
              sbom.cdx.json \
              --title "${TAG} — AsyLauncher (PD Print Fix, Excel Exporter, Touch Resizing & Font Scaling, 120Hz)" \
              --notes-file /tmp/release_notes.md \
              --latest
          fi

      - name: Upload Signed Google Play AAB as Private Workflow Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AsyLauncher-play-aab
          path: |
            lorie-app/build/outputs/bundle/release/lorie-app-release.aab
            lorie-app/build/outputs/mapping/release/mapping.txt
          retention-days: 14

      - name: Generate Cryptographic SLSA Build Provenance Attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            lorie-app/build/outputs/apk/release/lorie-app-release.apk
            lorie-app/src/main/assets/asycuda-iraq.tar.xz
