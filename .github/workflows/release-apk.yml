name: Build & Publish Signed Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to build and publish (e.g. v4.3.0)'
        required: true
        default: 'v4.3.0'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    name: Build, Sign & Publish Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run 7-Suite Adversarial Security Verification
        run: |
          mkdir -p /tmp/sec-tests
          javac -d /tmp/sec-tests java-bridge/AsycudaBoot.java lorie/src/main/java/com/termux/x11/AsycudaSecurityValidator.java scripts/SecurityVerificationTest.java
          java -cp /tmp/sec-tests SecurityVerificationTest

      - name: Prepare Runtime & Recompile Open-Source Java Bridge JARs
        run: |
          mkdir -p lorie-app/src/main/assets /tmp/asycuda-repack
          curl -fSL "https://github.com/MohammedALShimmary/ASYCUDA-Iraq-Android/releases/download/v4.0.0/runtime-arm64.tar.xz" \
            -o lorie-app/src/main/assets/runtime-arm64.tar.xz
          echo "f3dc78325792ea764e82d108b54dfc6fe4d6d9fd752bafc83bb780403286b9c1  lorie-app/src/main/assets/runtime-arm64.tar.xz" | sha256sum -c -

          curl -fSL "https://github.com/MohammedALShimmary/ASYCUDA-Iraq-Android/releases/download/v4.0.5/asycuda-iraq.tar.xz" \
            -o /tmp/base-asycuda-iraq.tar.xz
          echo "d7f724041d358c824af58c790c83ddf525f623450dd303995bcfbf48d8d81d52  /tmp/base-asycuda-iraq.tar.xz" | sha256sum -c -
          tar -xJf /tmp/base-asycuda-iraq.tar.xz -C /tmp/asycuda-repack
          find /tmp/asycuda-repack/jars -type f ! -name '00_*.jar' -delete
          find /tmp/asycuda-repack -name '*.bak' -delete
          echo -n "jars/00_boot.jar:jars/00_jnlp.jar" > /tmp/asycuda-repack/classpath.txt

          bash java-bridge/build-bridge.sh
          cp java-bridge/build/00_boot.jar /tmp/asycuda-repack/jars/00_boot.jar
          cp java-bridge/build/00_bootpatch.jar /tmp/asycuda-repack/jars/00_bootpatch.jar
          cp java-bridge/build/00_bootpatch.jar /tmp/asycuda-repack/00_bootpatch.jar
          cp java-bridge/build/00_jnlp.jar /tmp/asycuda-repack/jars/00_jnlp.jar
          cp java-bridge/known-errors-catalog.json /tmp/asycuda-repack/known-errors-catalog.json
          cp java-bridge/mof.crt /tmp/asycuda-repack/mof.crt
          cp lorie/src/main/res/drawable/ic_asycuda_logo.png /tmp/asycuda-repack/icons/asycuda.png

          python3 - << 'PYEOF'
          import os, tarfile, io, subprocess
          OLD = b"/data/data/" + b"iq" + b".asycuda/files"
          NEW = b"/proc/self/cwd/.asy_runtime"
          runtime_tar = "lorie-app/src/main/assets/runtime-arm64.tar.xz"
          tmp_in = "/tmp/runtime_in.tar"
          tmp_out = "/tmp/runtime_out.tar"
          subprocess.run(["xz", "-d", "-k", "-c", runtime_tar], stdout=open(tmp_in, "wb"), check=True)
          patched_files = {}
          with tarfile.open(tmp_in, "r:") as tf_in, tarfile.open(tmp_out, "w:") as tf_out:
              for m in tf_in.getmembers():
                  if m.isfile():
                      raw = tf_in.extractfile(m).read()
                      if OLD in raw:
                          raw = raw.replace(OLD, NEW)
                      if m.name in ("jre8/jre/lib/aarch64/jli/libjli.so", "jre8/lib/aarch64/jli/libjli.so"):
                          patched = raw.replace(b"/proc/self/exe", b"/proc/self/exX")
                          key = "jre_libjli.so" if "jre/lib" in m.name else "jdk_libjli.so"
                          patched_files[key] = patched
                      m.size = len(raw)
                      tf_out.addfile(m, io.BytesIO(raw))
                  else:
                      tf_out.addfile(m)
          subprocess.run(["xz", "-T0", "-6", "-c", tmp_out], stdout=open(runtime_tar, "wb"), check=True)
          os.remove(tmp_in)
          os.remove(tmp_out)

          with tarfile.open("lorie-app/src/main/assets/asycuda-iraq.tar.xz", "w:xz", preset=6) as tf:
              for k, data in patched_files.items():
                  ti = tarfile.TarInfo(name=k)
                  ti.size = len(data)
                  ti.mode = 0o700
                  tf.addfile(ti, io.BytesIO(data))
              tf.add("/tmp/asycuda-repack", arcname=".")
          PYEOF

      - name: Decode Release Keystore & Build Signed Release APK & Google Play AAB
        env:
          ASYCUDA_KEYSTORE_B64: ${{ secrets.ASYCUDA_KEYSTORE_B64 }}
          ASYCUDA_KEYSTORE_PASS: ${{ secrets.ASYCUDA_KEYSTORE_PASS }}
          ASYCUDA_KEY_PASS: ${{ secrets.ASYCUDA_KEY_PASS }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          echo "$ASYCUDA_KEYSTORE_B64" | base64 -d > lorie-app/asycuda_release.jks
          sed -i '/org.gradle.java.home/d' gradle.properties
          chmod +x gradlew
          ./gradlew :lorie-app:assembleRelease :lorie-app:bundleRelease -x lintVitalRelease -x lintVitalAnalyzeRelease --no-daemon
          rm -f lorie-app/asycuda_release.jks
          git checkout -- gradle.properties

      - name: Verify APK Signature & Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          if [[ "$TAG" != v* ]]; then
            TAG="v4.3.0"
          fi
          APK_NAME="AsyLauncher_${TAG}.apk"
          AAB_NAME="AsyLauncher_${TAG}.aab"
          cp lorie-app/build/outputs/apk/release/lorie-app-release.apk "/tmp/${APK_NAME}"
          cp lorie-app/build/outputs/bundle/release/lorie-app-release.aab "/tmp/${AAB_NAME}"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "/tmp/${APK_NAME}"

          APK_SHA256=$(sha256sum "/tmp/${APK_NAME}" | awk '{print $1}')
          AAB_SHA256=$(sha256sum "/tmp/${AAB_NAME}" | awk '{print $1}')
          TAR_SHA256=$(sha256sum lorie-app/src/main/assets/asycuda-iraq.tar.xz | awk '{print $1}')
          RUN_SHA256=$(sha256sum lorie-app/src/main/assets/runtime-arm64.tar.xz | awk '{print $1}')
          echo "APK_SHA256=${APK_SHA256}"
          echo "AAB_SHA256=${AAB_SHA256}"
          echo "TAR_SHA256=${TAR_SHA256}"
          echo "RUN_SHA256=${RUN_SHA256}"

          export TAG APK_SHA256 AAB_SHA256 TAR_SHA256 RUN_SHA256
          # Sync exact CI-built SHA-256 digests into README.md and SECURITY.md on main
          python3 - << 'PYEOF'
          import os, re
          tag = os.environ["TAG"]
          apk_sha = os.environ["APK_SHA256"]
          aab_sha = os.environ["AAB_SHA256"]
          tar_sha = os.environ["TAR_SHA256"]
          for path in ["README.md", "SECURITY.md"]:
              with open(path, "r") as f:
                  txt = f.read()
              txt = re.sub(
                  r'(\[\*\*`AsyLauncher_' + re.escape(tag) + r'\.apk`\*\*\]\([^\)]+\)\s*\|\s*(?:[^\|]+\|\s*)?`)([0-9a-f]{64}|TBD_ON_RELEASE_BUILD)(`)',
                  lambda m: m.group(1) + apk_sha + m.group(3),
                  txt
              )
              txt = re.sub(
                  r'(\[\*\*`AsyLauncher_' + re.escape(tag) + r'\.aab`\*\*\]\([^\)]+\)\s*\|\s*(?:[^\|]+\|\s*)?`)([0-9a-f]{64}|TBD_ON_RELEASE_BUILD)(`)',
                  lambda m: m.group(1) + aab_sha + m.group(3),
                  txt
              )
              txt = re.sub(
                  r'(\[\*\*`asycuda-iraq\.tar\.xz`\*\*\]\([^\)]+\)\s*\|\s*(?:[^\|]+\|\s*)?`)([0-9a-f]{64})(`)',
                  lambda m: m.group(1) + tar_sha + m.group(3),
                  txt
              )
              with open(path, "w") as f:
                  f.write(txt)
          PYEOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md SECURITY.md; then
            git add README.md SECURITY.md
            git commit -m "Docs: Sync CI-built SHA-256 checksums for ${TAG} [skip ci]"
            git push origin HEAD:main
          fi

          # Publish or update the GitHub Release and upload public assets
          cat << EOF > /tmp/release_notes.md
          # AsyLauncher — Launcher for ASYCUDA (\`${TAG}\` • \`versionCode 53\` — Major Release)

          > [!CAUTION]
          > **MAJOR SECURITY & ARCHITECTURE RELEASE (\`${TAG}\`) — ALL PREVIOUS RELEASES (\`< v4.3.0\`) ARE UNSAFE & NOT RECOMMENDED**
          > Release **\`${TAG}\`** is a **Major Security & Architecture Release**. All earlier releases (\`v4.2.0\`, \`v4.1.0\`, \`v4.0.5\`, \`v4.0.0\`, \`v3.9.5\`, \`v3.9.0\`, \`v3.8.0\`, \`v3.7.0\`, and \`v3.6.0\`) are now **unsafe, superseded, and strictly not recommended for production use**. Please upgrade immediately to **\`${TAG}\`**.

          ---

          ### What's New in Major Release \`${TAG}\` (\`versionCode 53\`)
          1. **AsyLauncher Rebrand & Android 16 (\`targetSdkVersion 36\`) Compliance**:
             - New independent brand identity (**AsyLauncher**, package \`io.github.mohammedalshimmary.asylauncher\`) with dynamic localized App Drawer names (**Launcher for ASYCUDA** / **مشغل أسيكودا** / **کارپێکەری ئەسیکۆدا**), adaptive vector icon, and Android 16 (\`targetSdkVersion 36\`) Google Play compliance.
          2. **Customizable Multi-Finger Gestures & Modern On-Screen Mouse Bar**:
             - Dedicated Trackpad (Virtual Mouse) and Direct Touchscreen modes with independent 1/2/3/4-finger tap & hold gesture customization and a translucent pill-styled L / M / R / Scroll wheel bar.
          3. **Floating Mini Customs Calculator & Interactive 5-Step Tutorial**:
             - Freeform, draggable, edge-resizable horizontal & vertical Customs Calculator attached directly to the floating Control Center pill, plus a guided 5-step interactive tutorial on first launch.
          4. **3-Layer Hardened Google Cloud Firestore Integration (\`firestore.rules\`)**:
             - Instant News & Release Alerts with unread badges (\`announcements/latest\`), live Known-Errors Catalog hot-reloading (\`app_config/known_errors_catalog\`), voluntary in-RAM redacted bug reports (\`diagnostic_reports\`), and once-per-day Zero-PII anonymous active installation heartbeats (\`app_metrics\`), protected by cryptographic X.509 release certificate pinning.
          5. **100% Dynamic Network, Port & IP Architecture (Zero Hardcoded IPs/Ports)**:
             - Dynamically discovers JNLP launch arguments, RMI transport ports (\`so.rmi.url.port\`), and virtualized RMI endpoints directly from \`AWIQWorld.jnlp\`, \`ClientTransportLayer\`, and live system DNS resolution without hardcoded server IPs or fallback ports.
          6. **Fail-Closed JVM Sandbox & Cryptographic JAR Verification**:
             - Enforces fail-closed \`SecurityManager\` sandbox initialization with canonical path protection (\`checkBlockedHostPath()\`), read-only JAR immutability, explicit JRE native library allowlisting, private \`sendToAndroidApk\` IPC authenticated via constant-time \`MessageDigest.isEqual\`, and cryptographic \`SOCODE.RSA\` JAR verification on initial download, startup, and mid-session restarts.

          ---

          ## 🇮🇶 ملخص الإصدار الرئيسي \`${TAG}\` (العربية)

          > **⚠️ تنبيه أمني هام (إصدار رئيسي شامل \`${TAG}\`)**: يُعد التحديث **\`${TAG}\`** إصداراً رئيسياً للأمان والبنية البرمجية. **جميع الإصدارات السابقة (\`< v4.3.0\` بما فيها \`v4.2.0\` وما قبله) أصبحت غير آمنة وملغاة ولا يُنصح باستخدامها نهائياً** — يُرجى التحديث فوراً إلى الإصدار **\`${TAG}\`**.

          ---

          ## کورتەی وەشانی سەرەکی \`${TAG}\` (کوردی)

          > **⚠️ ئاگاداری ئەمنی گرنگ (وەشانی سەرەکی \`${TAG}\`)**: وەشانی **\`${TAG}\`** وەشانێکی سەرەکی ئاسایش و پێکهاتەی بەرنامەکەیە. **گشت وەشانەکانی پێشتر (\`< v4.3.0\` بە \`v4.2.0\` و کۆنترەوە) چیتر سەلامەت نین و پێشنیار ناکرێن** — تکایە دەستبەجێ نوێی بکەرەوە بۆ **\`${TAG}\`**.

          ---

          ### SHA-256 Checksums (\`sha256sum\`)

          | Release Asset | SHA-256 Digest |
          | :--- | :--- |
          | **\`${APK_NAME}\`** | \`${APK_SHA256}\` |
          | **\`asycuda-iraq.tar.xz\`** | \`${TAR_SHA256}\` |
          | **\`runtime-arm64.tar.xz\`** | \`${RUN_SHA256}\` |

          ### APK X.509 Signing Certificate (\`apksigner verify --print-certs\`)
          - **Signer DN**: \`CN=Mohammed Ammar Hussein, OU=Logistics and Customs Software, O=ASYCUDA Iraq Open Source, L=Baghdad, ST=Baghdad, C=IQ\`
          - **SHA-256 Digest**: \`d302d4d050fb986e4088dd3e684c90662d00da748dde8da3d4966baea02da023\`
          EOF
          sed -i 's/^          //' /tmp/release_notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "${TAG} — Major Release (Customizable Gestures, Floating Mini Calculator, Interactive Tutorial & Cloud Firestore Sync)" --notes-file /tmp/release_notes.md --latest
            gh release upload "$TAG" \
              "/tmp/${APK_NAME}" \
              lorie-app/src/main/assets/asycuda-iraq.tar.xz \
              lorie-app/src/main/assets/runtime-arm64.tar.xz \
              sbom.cdx.json \
              --clobber
          else
            gh release create "$TAG" \
              "/tmp/${APK_NAME}" \
              lorie-app/src/main/assets/asycuda-iraq.tar.xz \
              lorie-app/src/main/assets/runtime-arm64.tar.xz \
              sbom.cdx.json \
              --title "${TAG} — Major Release (Customizable Gestures, Floating Mini Calculator, Interactive Tutorial & Cloud Firestore Sync)" \
              --notes-file /tmp/release_notes.md \
              --latest
          fi

          # Automatically flag all older releases as UNSAFE & SUPERSEDED — Not Recommended
          python3 - << 'PYEOF'
          import os, json, urllib.request
          current_tag = os.environ["TAG"]
          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ.get("GITHUB_REPOSITORY", "MohammedALShimmary/ASYCUDA-Iraq-Android")
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json"
          }
          banner = (
              "> [!CAUTION]\n"
              f"> **⚠️ UNSAFE & SUPERSEDED RELEASE — DO NOT USE IN PRODUCTION**\n"
              f"> This historical release is **unsafe, deprecated, and superseded** by **[Major Release `{current_tag}`](https://github.com/{repo}/releases/tag/{current_tag})**. All versions prior to `{current_tag}` (including `v4.0.5`) are unsafe and not recommended. Please upgrade immediately to **[`{current_tag}`](https://github.com/{repo}/releases/latest)**.\n\n---\n\n"
          )
          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases", headers=headers)
          rels = json.loads(urllib.request.urlopen(req).read().decode())
          for r in rels:
              t = r["tag_name"]
              if t == current_tag:
                  continue
              body = r.get("body") or ""
              import re
              m = re.search(r'(?m)^#{1,3}\s+', body)
              if m:
                  body = body[m.start():].lstrip()
              if t == "v4.1.0":
                  exp_banner = (
                      "> [!CAUTION]\n"
                      f"> **⚠️ EXPERIMENTAL / UNSAFE BUILD — DO NOT USE (UPGRADE TO `{current_tag}`)**\n"
                      f"> Release `v4.1.0` was an **experimental intermediate build** that has been superseded by **[Major Release `{current_tag}`](https://github.com/{repo}/releases/tag/{current_tag})**. Please upgrade immediately to **[`{current_tag}`](https://github.com/{repo}/releases/latest)**.\n\n---\n\n"
                  )
                  body = exp_banner + body
                  rel_title = f"{t} — [EXPERIMENTAL / UNSAFE BUILD — Superseded by Major Release {current_tag}]"
              else:
                  body = banner + body
                  rel_title = f"{t} — [UNSAFE / SECURITY UPGRADED IN {current_tag} — NOT RECOMMENDED]"
              payload = json.dumps({
                  "name": rel_title,
                  "body": body,
                  "prerelease": True
              }).encode("utf-8")
              preq = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases/{r['id']}",
                  data=payload, headers=headers, method="PATCH"
              )
              urllib.request.urlopen(preq).read()
          PYEOF

      - name: Upload Signed Google Play AAB as Private Workflow Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AsyLauncher-play-aab
          path: lorie-app/build/outputs/bundle/release/lorie-app-release.aab
          retention-days: 14

      - name: Generate Cryptographic SLSA Build Provenance Attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            lorie-app/build/outputs/apk/release/lorie-app-release.apk
            lorie-app/src/main/assets/asycuda-iraq.tar.xz
