apply plugin: 'com.android.application'
apply from: '../lorie/version.gradle'

android {
    namespace 'com.termux.x11.app'
    compileSdkVersion 34
    defaultConfig {
        applicationId "iq.asycuda"
        minSdkVersion 24
        targetSdkVersion 28
        versionCode 35
        versionName "3.5.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    def hasReleaseKeystore = file('asycuda_release.jks').exists()
    signingConfigs {
        debug {
            storeFile file(hasReleaseKeystore ? 'asycuda_release.jks' : 'testkey_untrusted.jks')
            keyAlias hasReleaseKeystore ? 'asycuda_iraq' : 'alias'
            storePassword hasReleaseKeystore ? (System.getenv('ASYCUDA_KEYSTORE_PASS') ?: 'AsycudaIraq2026!') : '123456'
            keyPassword hasReleaseKeystore ? (System.getenv('ASYCUDA_KEY_PASS') ?: 'AsycudaIraq2026!') : '123456'
            v1SigningEnabled true
            v2SigningEnabled true
        }
        release {
            storeFile file(hasReleaseKeystore ? 'asycuda_release.jks' : 'testkey_untrusted.jks')
            keyAlias hasReleaseKeystore ? 'asycuda_iraq' : 'alias'
            storePassword hasReleaseKeystore ? (System.getenv('ASYCUDA_KEYSTORE_PASS') ?: 'AsycudaIraq2026!') : '123456'
            keyPassword hasReleaseKeystore ? (System.getenv('ASYCUDA_KEY_PASS') ?: 'AsycudaIraq2026!') : '123456'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    compileOptions.sourceCompatibility JavaVersion.VERSION_1_9
    compileOptions.targetCompatibility JavaVersion.VERSION_1_9
    packagingOptions.jniLibs.useLegacyPackaging true

    androidResources {
        noCompress 'xz'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
    }
}

dependencies {
    implementation project(':lorie')
}
