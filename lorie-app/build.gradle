apply plugin: 'com.android.application'
apply from: '../lorie/version.gradle'

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def credPropsFile = new File(System.getProperty('user.home'), '.config/asycuda-dev/credentials.properties')
if (credPropsFile.exists()) {
    credPropsFile.withInputStream { localProps.load(it) }
}
def releaseStoreFilePath = localProps.getProperty('release.storeFile') ?: System.getenv('ASYCUDA_STORE_FILE') ?: new File(System.getProperty('user.home'), '.config/asycuda-dev/asycuda_release.jks').absolutePath
def releaseStoreFile = file(releaseStoreFilePath).exists() ? file(releaseStoreFilePath) : file('asycuda_release.jks')
def releaseStorePass = localProps.getProperty('release.storePassword') ?: System.getenv('ASYCUDA_KEYSTORE_PASS')
def releaseKeyPass = localProps.getProperty('release.keyPassword') ?: System.getenv('ASYCUDA_KEY_PASS')
def useReleaseKeystore = releaseStoreFile.exists() && releaseStorePass != null
def signDebugWithReleaseKey = project.hasProperty('signDebugWithReleaseKey') && Boolean.parseBoolean(project.property('signDebugWithReleaseKey').toString())

android {
    namespace 'com.termux.x11.app'
    compileSdkVersion 35
    defaultConfig {
        applicationId "io.github.mohammedalshimmary.asylauncher"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 57
        versionName "4.4.1"
        ndk {
            abiFilters 'arm64-v8a'
            debugSymbolLevel 'FULL'
        }
    }

    signingConfigs {
        release {
            if (useReleaseKeystore) {
                storeFile releaseStoreFile
                keyAlias 'asycuda_iraq'
                storePassword releaseStorePass
                keyPassword releaseKeyPass
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    compileOptions.sourceCompatibility JavaVersion.VERSION_1_9
    compileOptions.targetCompatibility JavaVersion.VERSION_1_9
    packagingOptions.jniLibs.useLegacyPackaging true
    packagingOptions.jniLibs.keepDebugSymbols += ['**/libld_linux_aarch64.so']

    androidResources {
        noCompress 'xz'
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    buildTypes {
        debug {
            if (useReleaseKeystore && signDebugWithReleaseKey) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
        }
        release {
            if (useReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
        }
    }
}

dependencies {
    implementation project(':lorie')
}

tasks.register('checkPendingDependabotPRs') {
    group = 'verification'
    description = 'Checks GitHub API for open Dependabot PRs before building a local release.'
    doLast {
        if (System.getenv('GITHUB_ACTIONS') == 'true' || project.hasProperty('skipDependabotCheck')) {
            return
        }
        def ghToken = localProps.getProperty('github.token') ?: System.getenv('GITHUB_TOKEN')
        if (!ghToken) {
            return
        }
        def url = new URL('https://api.github.com/repos/MohammedALShimmary/ASYCUDA-Iraq-Android/pulls?state=open&per_page=30')
        def conn = (HttpURLConnection) url.openConnection()
        conn.setRequestProperty('Authorization', "Bearer ${ghToken}")
        conn.setRequestProperty('Accept', 'application/vnd.github+json')
        conn.setConnectTimeout(5000)
        conn.setReadTimeout(5000)
        if (conn.responseCode == 200) {
            def pulls = new groovy.json.JsonSlurper().parse(conn.inputStream)
            def depPrs = pulls.findAll { pr ->
                pr.user?.login?.toLowerCase()?.contains('dependabot')
            }
            if (!depPrs.isEmpty()) {
                def summary = depPrs.collect { pr -> "  - PR #${pr.number}: ${pr.title} (${pr.html_url})" }.join('\n')
                throw new GradleException(
                    "\n================================================================================\n" +
                    "[DEPENDABOT GATE] Found ${depPrs.size()} open Dependabot PR(s) waiting for review:\n" +
                    "${summary}\n" +
                    "Verify compatibility, test, and merge/close these PR(s) before building a release\n" +
                    "(or pass -PskipDependabotCheck=true to bypass temporarily).\n" +
                    "================================================================================"
                )
            }
        }
    }
}

afterEvaluate {
    tasks.named('preReleaseBuild').configure {
        dependsOn tasks.named('checkPendingDependabotPRs')
    }
}
