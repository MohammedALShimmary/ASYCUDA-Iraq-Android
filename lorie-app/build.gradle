apply plugin: 'com.android.application'
apply from: '../lorie/version.gradle'

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def credPropsFile = new File(System.getProperty('user.home'), '.config/asycuda-dev/credentials.properties')
if (credPropsFile.exists()) {
    credPropsFile.withInputStream { localProps.load(it) }
}
def releaseStoreFilePath = localProps.getProperty('release.storeFile') ?: System.getenv('ASYCUDA_STORE_FILE') ?: new File(System.getProperty('user.home'), '.config/asycuda-dev/asycuda_release.jks').absolutePath
def releaseStoreFile = file(releaseStoreFilePath).exists() ? file(releaseStoreFilePath) : file('asycuda_release.jks')
def releaseStorePass = localProps.getProperty('release.storePassword') ?: System.getenv('ASYCUDA_KEYSTORE_PASS')
def releaseKeyPass = localProps.getProperty('release.keyPassword') ?: System.getenv('ASYCUDA_KEY_PASS')
def useReleaseKeystore = releaseStoreFile.exists() && releaseStorePass != null
def signDebugWithReleaseKey = project.hasProperty('signDebugWithReleaseKey') && Boolean.parseBoolean(project.property('signDebugWithReleaseKey').toString())

android {
    namespace 'com.termux.x11.app'
    compileSdkVersion 34
    defaultConfig {
        applicationId "iq.asycuda"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 50
        versionName "4.2.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            if (useReleaseKeystore) {
                storeFile releaseStoreFile
                keyAlias 'asycuda_iraq'
                storePassword releaseStorePass
                keyPassword releaseKeyPass
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    compileOptions.sourceCompatibility JavaVersion.VERSION_1_9
    compileOptions.targetCompatibility JavaVersion.VERSION_1_9
    packagingOptions.jniLibs.useLegacyPackaging true
    packagingOptions.jniLibs.keepDebugSymbols += ['**/libld_linux_aarch64.so']

    androidResources {
        noCompress 'xz'
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    buildTypes {
        debug {
            if (useReleaseKeystore && signDebugWithReleaseKey) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
        }
        release {
            if (useReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
    }
}

dependencies {
    implementation project(':lorie')
}
